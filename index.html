<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iron Watch</title>
<meta name="theme-color" content="#0A0E13"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: мобильное приложение 560px, нижняя навигация, оверлеи-листы поверх; тёмная палитра спортзала, акцент — международный оранжевый (цвет спасательных средств) */
:root{
  color-scheme:dark;
  --bg:#0A0E13; --s1:#121820; --s2:#1A222D; --line:#253040; --fg:#EDF1F5; --mut:#8693A4;
  --acc:#FF5A1F; --accs:#3A1E12; --ok:#3CC48E; --warn:#EDB13C; --bad:#EE5340; --body:#28323F; --body2:#323E4E;
  --fd:"Roboto Condensed","sans-serif-condensed","Arial Narrow",system-ui,sans-serif;
  --fb:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;
  --fm:ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--fb);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--fg);background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--fd);margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 150px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{font-size:28px;flex:1;min-width:0}
.lbl{font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.sec{margin-top:24px;display:grid;gap:10px}
.sec>h2{font-size:22px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.sec>h2 small{font-family:var(--fb);font-size:13px;color:var(--mut);font-weight:400;margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{min-width:0}
.stat b{display:block;font-family:var(--fd);font-size:26px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{color:var(--mut);font-size:12.5px}
.delta{display:inline-block;margin-top:4px;font-family:var(--fm);font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--s2);color:var(--mut)}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14.5px;text-decoration:none}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1A0A03}
.btn.big{width:100%;padding:14px;font-size:16px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12.5px;border-radius:999px;padding:5px 11px;border:1px solid var(--line);background:var(--s1);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1A0A03;font-weight:600}
.tag{font-size:11.5px;border-radius:999px;padding:2px 8px;background:var(--s2);color:var(--mut);white-space:nowrap}
.tag.p{background:var(--accs);color:var(--acc)}
.tag.rec{background:#3A2E0E;color:var(--warn);font-family:var(--fm);letter-spacing:.06em}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:18px 10px;border:1px dashed var(--line);border-radius:12px}
.muted{color:var(--mut)}

/* программы и тренировки */
.tpl{display:grid;gap:8px}
.tpl h3{font-size:20px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumb{background:var(--bg);border-radius:8px;aspect-ratio:4/3;position:relative;overflow:hidden}
.thumb canvas,.thumb svg{width:100%;height:100%;display:block}
.thumb i{position:absolute;right:4px;bottom:2px;font-style:normal;font-family:var(--fm);font-size:10.5px;color:var(--mut)}
.wcard{display:grid;gap:10px;cursor:pointer}
.wcard .meta{display:flex;gap:16px;flex-wrap:wrap}
.wcard .meta div small{display:block;color:var(--mut);font-size:12px}
.wcard .meta div b{font-family:var(--fd);font-size:20px}
.cmp{font-size:13.5px;color:var(--fg);background:var(--s2);border-radius:8px;padding:8px 10px}
.cmp b{color:var(--acc)}

/* библиотека */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mcell{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:6px 6px 8px;cursor:pointer;display:grid;gap:2px;text-align:center}
.mcell svg{width:100%;height:auto;display:block}
.mcell span{font-family:var(--fd);font-size:15px}
.mcell small{color:var(--mut);font-size:11px}
.mcell.on{border-color:var(--acc)}
.exlist{display:grid;gap:6px}
.exi{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;text-align:left;width:100%}
.exi .thumb{aspect-ratio:4/3}
.exi .t{min-width:0;display:grid;gap:3px}
.exi .t b{font-weight:600;font-size:14.5px;line-height:1.25}
.exi .t div{display:flex;gap:4px;flex-wrap:wrap}
.exi .last{font-family:var(--fm);font-size:11.5px;color:var(--mut);text-align:right;padding-right:6px}
.exi.sel{border-color:var(--acc);background:var(--accs)}
.search{width:100%;padding:11px 14px;border-radius:12px;background:var(--s1)}

/* активная тренировка */
.whead{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:8px 10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.whead input{font-family:var(--fd);font-size:22px;font-weight:700;background:transparent;border:none;padding:0;width:100%}
.whead .meta{display:flex;gap:18px}
.whead .meta b{font-family:var(--fd);font-size:20px}
.whead .meta small{display:block;color:var(--mut);font-size:11.5px}
.excard{display:grid;gap:8px;margin-top:12px}
.exh{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center}
.exh .t{min-width:0;display:grid;gap:3px}
.exh .t b{font-family:var(--fd);font-size:19px;line-height:1.1;cursor:pointer}
.exh .last{font-size:12.5px;color:var(--mut)}
.exh .tools{display:flex;gap:2px}
.ib{width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:var(--mut);cursor:pointer;display:grid;place-items:center;font-size:16px}
.ib:hover{background:var(--s2);color:var(--fg)}
.sets{display:grid;gap:4px}
.sr{display:grid;grid-template-columns:28px 1fr 74px 64px 40px;gap:6px;align-items:center}
.sr.hd{font-family:var(--fm);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.sr .n{font-family:var(--fm);font-weight:600;text-align:center;color:var(--mut)}
.sr .prev{font-family:var(--fm);font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr input{text-align:center;padding:8px 4px;font-variant-numeric:tabular-nums;font-weight:600;width:100%}
.sr input::placeholder{color:#5D6A7B;font-weight:400}
.ck{width:40px;height:38px;border-radius:9px;border:1.5px solid var(--line);background:var(--s2);cursor:pointer;display:grid;place-items:center;color:var(--mut);font-size:17px}
.sr.done{background:rgba(60,196,142,.08);border-radius:9px}
.sr.done .ck{background:var(--ok);border-color:var(--ok);color:#06210F}
.sr.done .n{color:var(--ok)}
.addset{justify-self:start}

/* оверлеи */
.ov{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov .app{padding-top:calc(10px + env(safe-area-inset-top,0px))}
.ovtop{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:sticky;top:0;background:var(--bg);z-index:3;padding-block:6px}
.ovtop h2{font-size:22px;flex:1;min-width:0}
.back{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--s1);cursor:pointer;font-size:20px;display:grid;place-items:center}
.hero{background:var(--s1);border:1px solid var(--line);border-radius:14px;aspect-ratio:4/3;max-width:100%;overflow:hidden}
.hero canvas{width:100%;height:100%;display:block}
.bodyw{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:8px}
.bodyw svg{width:100%;height:auto;display:block;max-height:280px}
.cues{margin:0;padding-left:20px;display:grid;gap:4px}
.cues li::marker{color:var(--acc)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.kv small{display:block;color:var(--mut);font-size:11.5px}
.kv b{font-family:var(--fd);font-size:20px;white-space:nowrap}
.hist{display:grid;gap:6px}
.hist .h{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;border-bottom:1px solid var(--line);padding-bottom:6px}
.hist .h span:last-child{font-family:var(--fm);font-size:12.5px;text-align:right}
.chart svg{width:100%;height:auto;display:block}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--acc)}
.bar .tr{background:var(--s2);border-radius:5px;overflow:hidden}
.bar span:last-child{font-family:var(--fm);text-align:right}
.rec{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rec small{color:var(--mut);font-size:12px}
.rec .v{font-family:var(--fm);text-align:right}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dwt{height:10px;background:var(--s2);border-radius:5px;overflow:hidden}
.dwt i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--warn));min-width:3px}
.sumhero{text-align:center;display:grid;gap:6px;padding:18px 8px}
.sumhero .big{font-family:var(--fd);font-size:46px;line-height:1}
.confirm{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:end center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.confirm .card{width:100%;max-width:520px;display:grid;gap:12px;padding:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;max-width:90vw}
.pick{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--s1);border-top:1px solid var(--line)}
.pick .btn{width:100%;max-width:528px;margin:0 auto;display:flex}

/* нижняя панель */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,14,19,.96);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{background:none;border:none;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--mut);font-size:11px}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--fg);background:var(--s2)}
.nav button.go svg{color:var(--acc)}
.nav button.live{color:var(--acc)}
.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:19;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.timer .in{max-width:528px;margin:0 auto 8px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden}
.timer .pr{position:absolute;left:0;top:0;bottom:0;background:var(--accs);z-index:0}
.timer .in>*{position:relative;z-index:1}
.timer .clk{font-family:var(--fm);font-weight:600;font-size:22px;min-width:4ch}
.timer .clk.done{color:var(--ok)}
.timer .sp{flex:1}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--s1);border-radius:10px;padding:9px 4px;cursor:pointer;font-size:13.5px;display:grid;gap:1px}
.seg button small{color:var(--mut);font-size:11px}
.seg button.on{border-color:var(--acc);background:var(--accs);color:var(--fg)}
.mpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mpick button{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:4px 2px 6px;cursor:pointer;display:grid;gap:0;font-size:12px}
.mpick button svg{width:100%;height:auto;max-height:84px}
.mpick button.on{border-color:var(--acc);background:var(--accs)}
.gex{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:6px}
.gex .t{min-width:0;display:grid;gap:2px}
.gex .t b{font-size:14.5px;font-weight:600;line-height:1.25}
.gex .t span{font-family:var(--fm);font-size:12px;color:var(--mut)}
.gex .tools{display:flex;gap:2px}
.why{font-size:12px;color:var(--mut)}
.about{display:grid;gap:10px}
.about .logo{width:52px;height:52px;flex:0 0 52px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.about .logo svg{width:100%;height:100%;display:block}
.kvl{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.kvl>*:last-child{text-align:right}
.link{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:var(--fg);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.link:hover{border-color:var(--acc)}
.link span:first-child{display:grid;gap:1px;min-width:0}
.link b{font-size:14px;font-weight:600}
.link small{font-family:var(--fm);font-size:12px;color:var(--acc)}
.link span:last-child{color:var(--acc);font-size:18px}
.flame{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:5px 11px 5px 8px;color:var(--mut);cursor:pointer;font-family:var(--fd);font-size:18px}
.flame.on{color:#FF8A1F;border-color:#5A3414;background:#2A1A0E}
.flame.big{border:none;background:none;justify-content:center;padding:0}.flame.big svg{width:54px;height:54px}
.wdots{display:inline-flex;gap:4px}.wdots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line)}.wdots i.on{background:#FF8A1F;border-color:#FF8A1F}
.cal{display:grid;gap:4px}
.cw{display:grid;grid-template-columns:48px repeat(7,1fr) 34px;gap:4px;align-items:center}
.cw.hd b{font-size:10.5px;color:var(--mut);text-align:center;font-weight:500}
.cwl{font-family:var(--fm);font-size:10.5px;color:var(--mut)}
.cw i{display:block;aspect-ratio:1;border-radius:5px;background:var(--s2)}
.cw i.on{background:var(--acc)}.cw i.today{outline:1.5px solid var(--fg);outline-offset:-1.5px}.cw i.fut{opacity:.35}
.cwk{font-family:var(--fm);font-size:11px;text-align:center;color:var(--mut)}.cwk.ok{color:var(--ok)}.cwk.miss{color:var(--bad)}
.gear{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.gear button{text-align:left;border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:8px 10px;cursor:pointer;display:grid;gap:1px;min-width:0}
.gear button b{font-size:13.5px;font-weight:600}
.gear button small{color:var(--mut);font-size:11px}
.gear button.on{border-color:var(--ok);background:rgba(60,196,142,.1)}
.rx{font-size:12.5px;line-height:1.35}.rx.up{color:var(--ok)}.rx.down{color:var(--bad)}.rx.new{color:var(--warn)}.rx.stall{color:var(--warn)}
.ver{margin-top:28px;text-align:center;font-family:var(--fm);font-size:11px;color:var(--mut)}
@media (max-width:380px){.sr{grid-template-columns:24px 1fr 64px 56px 38px;gap:4px}.exh{grid-template-columns:62px 1fr auto}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

const VER='1.6';
const KEY='ironwatch.v1';

const MUS={chest:'Грудь',back:'Спина',traps:'Трапеции',lowerback:'Поясница',shoulders:'Плечи',biceps:'Бицепс',triceps:'Трицепс',forearms:'Предплечья',abs:'Пресс',quads:'Квадрицепс',hamstrings:'Бицепс бедра',glutes:'Ягодицы',calves:'Икры'};

// id, название, анимация, нагрузка, инвентарь, основные, вторичные, техника, тип (w|bw|time)
const EXRAW=[
['bench_bb','Жим штанги лёжа','bench',null,'bar','chest','triceps,shoulders','Лопатки сведены и опущены, ноги упёрты в пол|Штанга касается низа груди, локти около 45°|Без отбива от груди'],

/* ===================== расчёты ===================== */
const e1=(w,r)=>w>0&&r>0?(r===1?w:w*(1+r/30)):0;
function setVol(ex,s){const k=exById(ex.id).k;if(k==='time')return 0;return num(s.w)*num(s.r)}
const counted=(w,s)=>s.done||w!==S.active;
function wVol(w){let v=0;w.ex.forEach(e=>e.sets.forEach(s=>{if(counted(w,s))v+=setVol(e,s)}));return v}
function wSets(w){let n=0;w.ex.forEach(e=>e.sets.forEach(s=>{if(counted(w,s))n++}));return n}
function compare(v){
  if(v<OBJ[0][1])return null;
  let best=OBJ[0];for(const o of OBJ)if(o[1]<=v)best=o;
  return {name:best[0],n:v/best[1]};
}
function cmpHTML(v){const c=compare(v);if(!c)return '';return `<div class="cmp">Это как поднять <b>${c.n>=1.05?nf(c.n,1)+' × ':''}${esc(c.name)}</b></div>`}
function lastFor(id,excludeId){
  for(let i=S.workouts.length-1;i>=0;i--){const w=S.workouts[i];if(w.id===excludeId)continue;
    const e=w.ex.find(x=>x.id===id);if(e&&e.sets.length)return {w,sets:e.sets}}
  return null;
}
function bestFor(id,before){
  let b={w:0,e1:0,vol:0,reps:0,date:0};
  S.workouts.forEach(w=>{if(before&&w.start>=before)return;w.ex.forEach(e=>{if(e.id!==id)return;e.sets.forEach(s=>{
    const W=num(s.w),R=num(s.r),E=e1(W,R);
    if(W>b.w){b.w=W}if(E>b.e1){b.e1=E;b.date=w.start}if(W*R>b.vol)b.vol=W*R;if(R>b.reps)b.reps=R;})})});
  return b;
}
function computePRs(w){
  const out=[];
  w.ex.forEach(e=>{const ex=exById(e.id);if(ex.k==='time')return;
    const prev=bestFor(e.id,w.start);if(!prev.date&&!prev.reps)return;
    let bw=0,be=0,br=0;e.sets.forEach(s=>{const W=num(s.w),R=num(s.r);bw=Math.max(bw,W);be=Math.max(be,e1(W,R));br=Math.max(br,R)});
    if(ex.k==='bw'&&!bw){if(br>prev.reps)out.push({id:e.id,t:'Повторы',v:br+' повт.'});return}
    if(be>prev.e1+0.01)out.push({id:e.id,t:'Расчётный 1ПМ',v:nf(be,1)+' кг'});
    else if(bw>prev.w)out.push({id:e.id,t:'Вес',v:nf(bw,1)+' кг'});
  });
  return out;
}
function weekStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return d.getTime()}
function muscleLoad(days){
  const from=Date.now()-days*864e5,res={};Object.keys(MUS).forEach(k=>res[k]=0);
  S.workouts.forEach(w=>{if(w.start<from)return;w.ex.forEach(e=>{const ex=exById(e.id),n=e.sets.length;
    ex.m.forEach(m=>res[m]+=n);ex.s.forEach(m=>res[m]+=n*.5)})});
  return res;
}
function recovery(){
  const now=Date.now(),f={};Object.keys(MUS).forEach(k=>f[k]=0);
  S.workouts.forEach(w=>{const h=(now-(w.end||w.start))/36e5;if(h>72)return;const k=1-h/72;
    w.ex.forEach(e=>{const ex=exById(e.id),n=e.sets.length;ex.m.forEach(m=>f[m]+=n*10*k);ex.s.forEach(m=>f[m]+=n*5*k)})});
  const r={};for(const m in f)r[m]=Math.max(0,Math.round(100-f[m]));return r;
}

const DAY=864e5,WEEK=7*DAY;
const dayStart=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
function streak(){
  const goal=Math.max(1,Math.min(7,S.settings.wgoal|0||2)),gapD=Math.max(1,S.settings.gap|0||4);
  const days=[...new Set(S.workouts.map(w=>dayStart(w.start)))].sort((a,b)=>a-b);
  const perWeek={};days.forEach(d=>{const k=weekStart(d);perWeek[k]=(perWeek[k]||0)+1});
  const thisW=weekStart(Date.now()),cur=perWeek[thisW]||0;
  // недели подряд с выполненной целью; текущая неделя не рвёт серию, пока не закончилась
  let wk=0,w=cur>=goal?thisW:thisW-WEEK;
  while((perWeek[w]||0)>=goal){wk++;w=weekStart(w-3*DAY)}
  let best=0,run=0;const ks=Object.keys(perWeek).map(Number).sort((a,b)=>a-b);
  if(ks.length){for(let x=ks[0];x<=thisW;x=weekStart(x+10*DAY)){if((perWeek[x]||0)>=goal){run++;best=Math.max(best,run)}else if(x!==thisW)run=0}}
  // серия тренировок без перерыва длиннее gapD дней
  let ser=0,bestSer=0,r=0;
  days.forEach((d,i)=>{r=i&&Math.round((d-days[i-1])/DAY)<=gapD?r+1:1;bestSer=Math.max(bestSer,r)});
  const last=days[days.length-1],since=last!=null?Math.round((dayStart(Date.now())-last)/DAY):null;
  ser=last!=null&&since<=gapD?r:0;
  const left=Math.round((thisW+WEEK-dayStart(Date.now()))/DAY);
  return {goal,gapD,wk,best:Math.max(best,wk),cur,left,ser,bestSer,since,perWeek,days:new Set(days),burn:since!=null&&since<=gapD?gapD-since:0};
}

/* ===================== генератор ===================== */
const BIG=['chest','back','quads','hamstrings','glutes'];
const GOALS={mass:{n:'Гипертрофия',main:[4,6],acc:[3,8],iso:[3,10],rest:150}};
/* ---------- тренер: гипертрофия, двойная прогрессия ---------- */
const RANGES={main:[6,10],acc:[8,12],iso:[10,15],bw:[10,20],time:[30,60]};
const INC={bar:2.5,ez:2.5,db:2.5,cable:5,mach:5,bw:0};
const SETS={main:4,acc:3,iso:3,bw:3,time:3};
function cls(ex){if(ex.k==='time')return 'time';if(ex.k==='bw')return 'bw';const sc=score(ex);return sc>=3?'main':sc>=2?'acc':'iso'}
const snap=(v,step)=>Math.max(step,Math.round(v/step)*step);
function sessionsFor(id,n){const out=[];for(let i=S.workouts.length-1;i>=0&&out.length<n;i--){const e=S.workouts[i].ex.find(x=>x.id===id);if(e&&e.sets.length)out.push({w:S.workouts[i],sets:e.sets})}return out}
function rx(id,nSets){
  const ex=exById(id),c=cls(ex),[lo,hi]=RANGES[c],step=INC[ex.eq]||2.5;
  const rir={main:'запас 1–2 повтора',acc:'запас 1 повтор',iso:'последний подход до отказа',bw:'запас 1–2 повтора',time:''}[c];
  const ss=sessionsFor(id,3),R={lo,hi,c,rir,w:[],r:[],st:'new',top:0};
  if(!ss.length){R.note=c==='time'?`Первый раз: держи ${lo}–${hi} с`:`Первый раз: подбери вес на ${lo}–${hi} повторов`;for(let j=0;j<nSets;j++)R.r.push(lo);return R}
  const L=ss[0].sets,top=Math.max(...L.map(s=>num(s.w))),rs=L.filter(s=>num(s.w)===top).map(s=>num(s.r)),at=j=>L[Math.min(j,L.length-1)];
  R.top=top;
  if(c==='time'||!top){const add=c==='time'?5:1;R.st=rs.every(r=>r>=hi)?'up':'hold';
    for(let j=0;j<nSets;j++)R.r.push(num(at(j).r)+add);
    R.note=c==='time'?'+5 с к каждому подходу':R.st==='up'?`Все подходы по ${hi}+ — добавь отягощение`:'+1 повтор к каждому подходу';
  }else if(rs.every(r=>r>=hi)){const nw=snap(top+step,step);R.st='up';
    for(let j=0;j<nSets;j++){R.w.push(nw);R.r.push(lo)}
    R.note=`Все подходы по ${hi}+ — вес +${nf(nw-top,1)} кг, начни с ${lo} повторов`;
  }else if(Math.min(...rs)<lo-1){const nw=snap(top*.92,step);R.st='down';
    for(let j=0;j<nSets;j++){R.w.push(nw);R.r.push(lo)}
    R.note=`Было меньше ${lo} повторов — вес снижен до ${nf(nw,1)} кг`;
  }else{R.st='hold';
    for(let j=0;j<nSets;j++){const q=at(j);R.w.push(top);R.r.push(Math.min(hi,Math.max(lo,(num(q.w)===top?num(q.r):lo-1)+1)))}
    R.note=`Тот же вес, +1 повтор в каждом подходе (до ${hi})`;
  }
  if(ss.length>=3&&c!=='time'){const b=ss.map(x=>Math.max(...x.sets.map(q=>e1(num(q.w),num(q.r))||num(q.r))));
    if(b[0]<=b[2]&&b[1]<=b[2]){R.stall=true;R.note+='. Три тренировки без прогресса — замени упражнение ⇄ или сними 10% веса'}}
  return R;
}

function warmup(id,w){const ex=exById(id);if(cls(ex)!=='main'||!(w>=40))return '';const st=INC[ex.eq]||2.5,min=ex.eq==='bar'?20:st;
  return `<div class="why">Разминка: ${[[.4,10],[.6,5],[.8,2]].map(([k,r])=>`${nf(Math.max(min,snap(w*k,st)),1)}×${r}`).join(' · ')}</div>`}
const TIMES=[[45,'45 мин'],[60,'1 час'],[90,'1,5 часа'],[120,'2 часа']];
const score=ex=>ex.s.length+(ex.eq==='bar'?2.5:ex.eq==='db'?1.2:ex.eq==='ez'?.5:0)-(ex.k==='w'?0:1.5);

function genEstimate(list){const r=GOALS[G.goal].rest;return Math.round(10+list.reduce((a,e)=>a+e.sets*(r+45),0)/60)}
function generate(){
  if(!G.m.length){G.list=[];return}
  const gl=GOALS[G.goal],perEx=(gl.acc[0]*(gl.rest+45))/60;
  let N=Math.max(G.m.length,Math.min(10,Math.round((G.time-10)/perEx)));
  const wts=G.m.map(m=>BIG.includes(m)?2:1),sw=wts.reduce((a,b)=>a+b,0);
  let alloc=G.m.map((m,i)=>Math.max(1,Math.round(N*wts[i]/sw)));
  while(alloc.reduce((a,b)=>a+b,0)>N){const i=alloc.indexOf(Math.max(...alloc));if(alloc[i]<=1)break;alloc[i]--}
  const used=new Set(),out=[];
  G.m.forEach((m,mi)=>{
    const pool=allEx().filter(ex=>ex.m.includes(m)&&gearOn(ex.eq));
    const figs=new Set();
    for(let k=0;k<alloc[mi];k++){
      const left=pool.filter(ex=>!used.has(ex.id));if(!left.length)break;
      let pick;
      if(k===0){const top=left.slice().sort((a,b)=>score(b)-score(a)).slice(0,3);pick=rnd(top)}
      else{const fresh=left.filter(ex=>!figs.has(ex.fig));pick=rnd(fresh.length?fresh:left)}
      used.add(pick.id);figs.add(pick.fig);
      const sc=score(pick),scheme=k===0&&sc>=3?gl.main:sc>=2?gl.acc:gl.iso,ti=exById(pick.id).k==='time';
      out.push({id:pick.id,m,sets:scheme[0],reps:ti?45:scheme[1]});
    }
  });
  // базовые вперёд, изоляция в конец, мышцы по порядку выбора
  out.sort((a,b)=>G.m.indexOf(a.m)-G.m.indexOf(b.m)||score(exById(b.id))-score(exById(a.id)));
  const seen=new Set(),wkLoad=muscleLoad(7);
  out.forEach(e=>{const ex=exById(e.id),sc=score(ex),first=!seen.has(e.m);seen.add(e.m);
    const c=cls(ex),cc=first||c!=='main'?c:'acc';e.sets=SETS[cc];e.reps=RANGES[cc][0];
    const wk=wkLoad[e.m]||0;if(wk>=14)e.sets=Math.max(2,e.sets-1);});
  G.list=out;
}

function alternatives(id,exclude){

    .sort((a,b)=>b.sim-a.sim).map(o=>o.ex);

  if(k==='wname'){S.active.name=t.value;save();return}
  if(k==='sw'||k==='sr'){const s=S.active.ex[t.dataset.i].sets[t.dataset.j];s[k==='sw'?'w':'r']=t.value.replace(',','.');save();liveHead();return}
  if(k==='set'){const key=t.dataset.k;S.settings[key]=key==='sound'?t.value==='1':num(t.value);save();return}
});
document.addEventListener('change',ev=>{if(ev.target.id==='imp'&&ev.target.files[0]){const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(ev.target.files[0]);ev.target.value=''}
  if(ev.target.dataset.in==='set')render()});
function liveHead(){if(!S.active)return;const v=wVol(S.active),a=$('#vol'),c=$('#cmpw');if(a)a.textContent=kg(v);if(c)c.innerHTML=cmpHTML(v)}
setInterval(()=>{if(S.active){const e=$('#el');if(e)e.textContent=clock(Date.now()-S.active.start);const h=$('#hel');if(h)h.textContent=clock(Date.now()-S.active.start)}},1000);

/* ===================== таймер отдыха ===================== */
let T={end:0,total:0,iv:null},actx=null,lock=null;
function beep(){if(!S.settings.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  [0,.25,.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);
  g.gain.setValueAtTime(.0001,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d+.2);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.22)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startTimer(sec){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  T.total=sec;T.end=Date.now()+sec*1000;clearInterval(T.iv);T.iv=setInterval(tickTimer,250);tickTimer();
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>lock=l).catch(()=>{})}catch(e){}}
function stopTimer(){clearInterval(T.iv);T.iv=null;T.end=0;$('#timer').innerHTML='';try{lock&&lock.release()}catch(e){}lock=null}
function tickTimer(){const left=Math.max(0,Math.round((T.end-Date.now())/1000)),el=$('#timer');
  el.innerHTML=`<div class="timer"><div class="in"><div class="pr" style="width:${T.total?100*(1-left/T.total):0}%"></div>
   <span class="lbl">Отдых</span><span class="clk ${left?'':'done'}">${left?Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):'Подход!'}</span><span class="sp"></span>
   <button class="btn sm" data-a="tm" data-s="-15">−15</button><button class="btn sm" data-a="tm" data-s="15">+15</button><button class="btn sm ghost" data-a="tstop">✕</button></div></div>`;
  if(!left){clearInterval(T.iv);T.iv=null;beep();setTimeout(()=>{if(!T.iv)stopTimer()},6000)}}

ACT.gen=()=>push({t:'gen'});
ACT.gm=d=>{const i=G.m.indexOf(d.m);i<0?G.m.push(d.m):G.m.splice(i,1);generate();render()};
ACT.gg=d=>{G.goal=d.k;generate();render()};
ACT.gt=d=>{G.time=+d.t;generate();render()};
ACT.geq=d=>{G.off[d.e]=!G.off[d.e];generate();render()};
ACT.regen=()=>{generate();render()};
ACT.grm=d=>{G.list.splice(+d.i,1);render()};
ACT.gmore=()=>{const used=G.list.map(e=>e.id),gl=GOALS[G.goal];
  const pool=allEx().filter(ex=>G.m.some(m=>ex.m.includes(m))&&gearOn(ex.eq)&&!used.includes(ex.id));
  if(!pool.length){toast('Подходящие упражнения закончились');return}
  const p=rnd(pool);G.list.push({id:p.id,m:p.m[0],sets:gl.iso[0],reps:p.k==='time'?45:gl.iso[1]});render()};
ACT.gstart=()=>{const go=()=>{const list=G.list.slice();newWorkout(genName(),list)};if(S.active)ask('Уже идёт тренировка. Отменить её и начать новую?','Начать новую',go);else go()};
ACT.gsave=()=>{S.templates.push({id:uid(),name:genName(),ex:G.list.map(e=>({id:e.id,sets:e.sets,reps:e.reps}))});save();toast('Программа сохранена на главной')};
ACT.swap=d=>push({t:'swap',ctx:d.ctx,i:+d.i});
ACT.doSwap=d=>{const top=UI.stack[UI.stack.length-1];
  if(top.ctx==='gen'){const e=G.list[top.i];e.id=d.id;back();return}
  const e=S.active.ex[top.i],done=e.sets.some(s=>s.done);
  const go=()=>{e.id=d.id;e.sets=e.sets.map(()=>({w:'',r:'',done:false}));save();back();toast('Упражнение заменено')};
  if(done)ask('В этом упражнении уже есть выполненные подходы. Заменить и сбросить их?','Заменить',go);else go()};
ACT.gear=d=>{const g=S.settings.gear;if(d.e==='bw'&&g.bw){toast('Свой вес есть всегда');return}g[d.e]=g[d.e]?0:1;save();render()};
ACT.allGear=d=>{UI.allGear=d.v==='1';render()};
ACT.streak=()=>push({t:'streak'});
ACT.tm=d=>{T.end+= +d.s*1000;T.total=Math.max(T.total+ +d.s,1);tickTimer()};
ACT.tstop=()=>stopTimer();

readColors();render();
</script>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script></body></html>
